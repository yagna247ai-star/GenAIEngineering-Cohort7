<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title>AI Accelerator Hub GenAI Coaching — Enterprise Icon</title>
<desc>Enterprise neural-grid mark: 3x3 nodes with labyrinth ring and generative sparkle. Colors #0A0A0A #C9A86A #FFFFFF</desc>
<!-- Base -->
<rect width="120" height="120" rx="26" fill="#0A0A0A"/>
<!-- labyrinth outer ring - subtle enterprise frame -->
<circle cx="60" cy="60" r="43.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.2"/>
<!-- labyrinth arcs with gaps (from GenAI Coaching circular maze) -->
<g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="1.7" opacity="0.92">
  <!-- top arc left -->
  <path d="M 22.5 31.5 A 42 42 0 0 1 54.2 17.6"/>
  <!-- top arc right -->
  <path d="M 65.8 17.6 A 42 42 0 0 1 97.5 31.5"/>
  <!-- right mid -->
  <path d="M 101.2 38.5 A 42 42 0 0 1 101.2 81.5"/>
  <!-- bottom arc right -->
  <path d="M 97.5 88.5 A 42 42 0 0 1 65.8 102.4"/>
  <!-- bottom arc left -->
  <path d="M 54.2 102.4 A 42 42 0 0 1 22.5 88.5"/>
  <!-- left mid -->
  <path d="M 18.8 81.5 A 42 42 0 0 1 18.8 38.5"/>
  <!-- inner labyrinth -->
  <path d="M 30.8 42.2 A 28 28 0 0 1 56 32.2" stroke-width="1.45" opacity="0.72"/>
  <path d="M 64 32.2 A 28 28 0 0 1 89.2 42.2" stroke-width="1.45" opacity="0.72"/>
  <path d="M 93.5 49.5 A 28 28 0 0 1 93.5 70.5" stroke-width="1.45" opacity="0.72"/>
  <path d="M 89.2 77.8 A 28 28 0 0 1 64 87.8" stroke-width="1.45" opacity="0.72"/>
  <path d="M 56 87.8 A 28 28 0 0 1 30.8 77.8" stroke-width="1.45" opacity="0.72"/>
  <path d="M 26.5 70.5 A 28 28 0 0 1 26.5 49.5" stroke-width="1.45" opacity="0.72"/>
</g>
<!-- neural mesh connections -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- primary active paths in AI Accelerator Hub green -->
  <path d="M41 30 H49 M41 60 H49 M71 60 H79 M41 90 H49 M71 90 H79 M30 41 V49 M60 41 V49 M30 71 V79 M60 71 V79 M90 71 V79" stroke="#C9A86A" stroke-width="1.35" opacity="1"/>
  <!-- secondary neural diagonals in white low-opacity -->
  <path d="M37.8 37.8 L52.2 52.2 M67.8 37.8 L82.2 52.2 M37.8 67.8 L52.2 82.2 M67.8 67.8 L82.2 82.2 M52 52 L68 68 M52 68 L68 52" stroke="#FFFFFF" stroke-width="1" opacity="0.32"/>
</g>
<!-- nodes — enterprise precise circles -->
<!-- Row 1 -->
<circle cx="30" cy="30" r="10.2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="30" cy="30" r="2.3" fill="#0A0A0A" opacity="0.0"/>
<circle cx="60" cy="30" r="10.2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/>
<!-- generative sparkle — top right, replaces dot with enterprise star -->
<g transform="translate(90,30)">
  <!-- subtle outer glow -->
  <path d="M0 -15 C0.9 -4.2 2.1 -2.4 13 -0 C2.1 2.4 0.9 4.2 0 15 C-0.9 4.2 -2.1 2.4 -13 0 C-2.1 -2.4 -0.9 -4.2 0 -15 Z" fill="#C9A86A" opacity="0.22" transform="scale(1.15)"/>
  <path d="M0 -14.2 C0.85 -3.9 1.95 -2.15 12.2 0 C1.95 2.15 0.85 3.9 0 14.2 C-0.85 3.9 -1.95 2.15 -12.2 0 C-1.95 -2.15 -0.85 -3.9 0 -14.2 Z" fill="#C9A86A"/>
  <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" opacity="0.95"/>
</g>
<!-- Row 2 -->
<circle cx="30" cy="60" r="10.2" fill="#C9A86A" stroke="#B8941F" stroke-width="1"/>
<circle cx="30" cy="60" r="3.1" fill="#FFFFFF" opacity="0.92"/>
<circle cx="30" cy="60" r="1.25" fill="#0A0A0A" opacity="0.95"/>
<circle cx="60" cy="60" r="10.2" fill="#C9A86A" stroke="#B8941F" stroke-width="1"/>
<circle cx="60" cy="60" r="3.1" fill="#FFFFFF" opacity="0.92"/>
<circle cx="60" cy="60" r="1.25" fill="#0A0A0A" opacity="0.95"/>
<circle cx="90" cy="60" r="10.2" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1"/>
<circle cx="90" cy="60" r="2.6" fill="#0A0A0A" opacity="0.06"/>
<!-- Row 3 -->
<circle cx="30" cy="90" r="10.2" fill="#C9A86A" stroke="#B8941F" stroke-width="1"/>
<circle cx="30" cy="90" r="3.1" fill="#FFFFFF" opacity="0.92"/>
<circle cx="30" cy="90" r="1.25" fill="#0A0A0A" opacity="0.95"/>
<circle cx="60" cy="90" r="10.2" fill="#C9A86A" stroke="#B8941F" stroke-width="1"/>
<circle cx="60" cy="90" r="3.1" fill="#FFFFFF" opacity="0.92"/>
<circle cx="60" cy="90" r="1.25" fill="#0A0A0A" opacity="0.95"/>
<circle cx="90" cy="90" r="10.2" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1"/>
<circle cx="90" cy="90" r="2.6" fill="#0A0A0A" opacity="0.06"/>
</svg>
